name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI on every example
        run: |
          for p in examples/*/profile.json templates/character_profile.json; do
            python scripts/build_prompt.py "$p" --mode turnaround --with-reference > /dev/null
            python scripts/build_prompt.py "$p" --mode hero --scene "smoke test" > /dev/null
          done
